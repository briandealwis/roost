name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app (universal)
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Roost.app Roost.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roost
          path: build/Roost.zip
