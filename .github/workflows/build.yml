name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./build.sh test
      - name: Package (universal)
        run: ./build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Roost
          path: build/Roost-*.zip
